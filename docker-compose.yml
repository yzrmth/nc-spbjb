# =============================================================================
# Nextcloud + PostGIS + Redis + Caddy - stack Docker Compose
#
# Target: Windows + Docker Desktop (WSL2 backend), akses LAN via HTTPS.
# Public access (Cloudflare Tunnel) menyusul - lihat komentar "FASE PUBLIC"
# di bagian bawah dan di Caddyfile.
# =============================================================================

services:

  # ---------------------------------------------------------------------
  # Nextcloud (apache built-in, tidak perlu nginx/php-fpm terpisah)
  # ---------------------------------------------------------------------
  nextcloud:
    image: nextcloud:30-apache   # PIN versi mayor. Cek tag stabil terbaru di
                                 # https://hub.docker.com/_/nextcloud/tags
                                 # sebelum deploy pertama kali. Jangan pakai :latest
                                 # supaya upgrade selalu terkendali (lihat README).
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      # --- Koneksi database (Postgres, DB "bersih" tanpa PostGIS) ---
      POSTGRES_HOST: db
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}

      # --- Redis (cache + file locking) ---
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}

      # --- Domain & protocol ---
      # Space-separated. Isi placeholder IP LAN kamu di .env, tambahkan domain
      # public di sini nanti kalau sudah pasang Cloudflare Tunnel.
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
      # Caddy yang terminasi TLS, Nextcloud di belakangnya selalu dianggap https.
      OVERWRITEPROTOCOL: https
      # URL yang dipakai saat occ dijalankan dari CLI (cron, notifikasi, dll).
      # Fase LAN: isi https://<IP-LAN-kamu>. Fase public: ganti ke domain publik.
      OVERWRITECLIURL: ${NEXTCLOUD_OVERWRITE_CLI_URL}
      # IP/subnet Caddy supaya Nextcloud percaya header X-Forwarded-* darinya.
      TRUSTED_PROXIES: ${NEXTCLOUD_TRUSTED_PROXIES}

      # --- Akun admin, hanya dipakai sekali saat instalasi pertama ---
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
    volumes:
      # Named volumes (BUKAN bind-mount ke path Windows/NTFS). Alasan:
      # - I/O lewat bind-mount Windows<->WSL2 (/mnt/c/... atau path Windows)
      #   jauh lebih lambat daripada volume yang hidup di dalam filesystem
      #   ext4 milik VM WSL2, dan Nextcloud+Postgres sangat sensitif ke I/O.
      # - Named volume juga menghindari masalah permission UID/GID antara
      #   container Linux dan NTFS.
      # Implikasi: semua named volume disimpan di dalam file virtual disk
      # WSL2 (ext4.vhdx, biasanya di %LOCALAPPDATA%\Docker\wsl\data\ext4.vhdx).
      # File ini tumbuh mengikuti data yang kamu simpan tapi TIDAK otomatis
      # mengecil lagi walau data dihapus (perlu `wsl --shutdown` lalu
      # optimize-vhd/diskpart compact manual sesekali kalau butuh reclaim space).
      - nextcloud_html:/var/www/html
      - nextcloud_apps:/var/www/html/custom_apps
      - nextcloud_config:/var/www/html/config
      - nextcloud_data:/var/www/html/data
    networks:
      - frontend   # supaya bisa diakses Caddy
      - backend    # supaya bisa akses db & redis

  # ---------------------------------------------------------------------
  # Database: Postgres + PostGIS. Satu server Postgres, dua database:
  # - $NEXTCLOUD_DB_NAME : dipakai Nextcloud, TANPA extension apapun.
  # - $GIS_DB_NAME        : database terpisah untuk data GIS, extension
  #                         postgis di-enable di sini saja.
  # Dibuat otomatis oleh init-db/init-nextcloud-and-gis.sh saat volume
  # db_data masih kosong (lihat komentar di file tsb).
  # ---------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4   # Postgres 16 + PostGIS 3.4, versi di-pin.
    restart: unless-stopped
    environment:
      # Superuser Postgres, hanya dipakai untuk provisioning awal oleh
      # init script - Nextcloud maupun aplikasi GIS TIDAK memakai user ini.
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      # Diteruskan ke init script untuk membuat user/database Nextcloud & GIS.
      NEXTCLOUD_DB_NAME: ${NEXTCLOUD_DB_NAME}
      NEXTCLOUD_DB_USER: ${NEXTCLOUD_DB_USER}
      NEXTCLOUD_DB_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      GIS_DB_NAME: ${GIS_DB_NAME}
      GIS_DB_USER: ${GIS_DB_USER}
      GIS_DB_PASSWORD: ${GIS_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      # docker-entrypoint-initdb.d hanya dieksekusi oleh image postgres saat
      # direktori data (db_data) masih kosong -> otomatis "sekali saja".
      - ./init-db:/docker-entrypoint-initdb.d:ro
    # TIDAK ada "ports:" di sini secara sengaja -> Postgres hanya bisa
    # diakses container lain lewat network "backend", tidak ke host/LAN.
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------
  # Redis: dipakai Nextcloud untuk memcache.locking (dan opsional
  # memcache.local, lihat README). Password wajib supaya container lain
  # di network yang sama tidak bisa akses tanpa kredensial.
  # ---------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # TIDAK ada "ports:" -> Redis cuma bisa diakses via network "backend".
    # Tidak perlu volume: isinya murni cache, boleh hilang kalau container
    # dibuat ulang.
    networks:
      - backend

  # ---------------------------------------------------------------------
  # Caddy: reverse proxy HTTPS untuk akses LAN. Otomatis pakai sertifikat
  # internal (self-signed) untuk IP lokal - lihat Caddyfile untuk detail
  # dan cara ganti ke domain public nanti.
  # ---------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Port 80/443 default di host Windows ini sudah dipakai XAMPP Apache,
      # jadi dipindah ke 8443 supaya tidak bentrok. Port 80 (redirect
      # http->https & ACME challenge) sengaja TIDAK dipetakan - tidak
      # krusial untuk dev/LAN dengan tls internal. Kalau nanti pindah ke
      # PC workstation yang portnya bebas, boleh balikin ke "443:443" biasa.
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # menyimpan sertifikat TLS -> harus persisten
      - caddy_config:/config
    networks:
      - frontend
    depends_on:
      - nextcloud

# =============================================================================
# FASE PUBLIC (nanti): tambahkan service `cloudflared` di sini, sambungkan
# ke network `frontend`, arahkan tunnel ke `caddy:443` atau `nextcloud:80`.
# Lihat README bagian "Cloudflare Tunnel (fase public)".
# =============================================================================

networks:
  # Network untuk trafik yang datang dari luar (Caddy <-> Nextcloud).
  # Subnet di-fix supaya bisa dipakai sebagai nilai NEXTCLOUD_TRUSTED_PROXIES.
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # Network internal murni (Nextcloud <-> db, redis). Tidak ada exposure ke host.
  backend:
    driver: bridge

volumes:
  nextcloud_html:
  nextcloud_apps:
  nextcloud_config:
  nextcloud_data:
  db_data:
  caddy_data:
  caddy_config:
